<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코그페 할인 인증표</title>
<style>
:root {
  --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e4df;
  --accent: #2f5bd3; --good: #1f8a4c; --mid: #b7791f; --flat: #6b6b66; --bad: #c0392b;
  --good-bg: #e6f4ec; --mid-bg: #fdf3e1; --flat-bg: #efefec; --bad-bg: #fbe9e7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --card: #1f1f1d; --text: #ececea; --muted: #a0a09a; --line: #33332f;
    --accent: #7c9dff; --good: #5ccb8a; --mid: #e6b45a; --flat: #a0a09a; --bad: #ff8a7a;
    --good-bg: #1d3327; --mid-bg: #3a2f1a; --flat-bg: #2a2a27; --bad-bg: #3d2220;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 20px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.kpi b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--muted); font-size: 12px; }
.summary { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; margin-bottom: 20px; }
.summary > summary { font-size: 15px; font-weight: 600; cursor: pointer; }
.summary > summary .hint { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.summary[open] > summary .hint { display: none; }
.summary ul { margin: 6px 0 0; padding-left: 18px; }
.summary .caveat { color: var(--muted); font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.controls input, .controls select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--text); font: inherit; }
.controls input { flex: 1 1 220px; }
.count { color: var(--muted); align-self: center; margin-left: auto; }
.tablewrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; min-width: 1100px; }
th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { position: sticky; top: 0; background: var(--card); font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
th[data-sort]::after { content: " ↕"; opacity: .4; }
th.asc::after { content: " ↑"; opacity: 1; } th.desc::after { content: " ↓"; opacity: 1; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td .prod { font-weight: 600; } td .meta { color: var(--muted); font-size: 12px; }
.neg { color: var(--bad); } .pos { color: var(--good); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.b-good { background: var(--good-bg); color: var(--good); } .b-mid { background: var(--mid-bg); color: var(--mid); }
.b-flat { background: var(--flat-bg); color: var(--flat); } .b-bad { background: var(--bad-bg); color: var(--bad); }
a.buy { display: inline-block; padding: 4px 10px; border-radius: 6px; background: var(--accent); color: #fff; text-decoration: none; font-size: 12px; white-space: nowrap; }
.note { color: var(--muted); font-size: 12px; max-width: 280px; }
.more { display: block; margin: 12px auto 0; padding: 8px 18px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--text); font: inherit; cursor: pointer; }
.progress { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 20px; }
.progress summary { cursor: pointer; font-weight: 600; }
.progress summary span { color: var(--muted); font-weight: 400; font-size: 13px; }
.progress .tablewrap { border: none; margin-top: 8px; max-height: 420px; overflow: auto; }
.ptable { min-width: 600px; }
.pcell { display: flex; gap: 10px; align-items: flex-start; min-width: 260px; }
.thumb { width: 56px; height: 56px; flex: none; border-radius: 6px; object-fit: cover; background: var(--flat-bg); border: 1px solid var(--line); }
.rating { color: var(--mid); font-size: 12px; font-weight: 600; } .rating span { color: var(--muted); font-weight: 400; }
.cond { color: var(--muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 340px; }
td:first-child { white-space: nowrap; }
.stage { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 4px; }
.empty { padding: 30px; text-align: center; color: var(--muted); }
@media (max-width: 720px) {
  table, thead, tbody, tr, td { display: block; min-width: 0; }
  thead { display: none; }
  tr { border-bottom: 1px solid var(--line); padding: 10px 12px; }
  td { border: none; padding: 2px 0; text-align: left !important; }
  td[data-label]::before { content: attr(data-label) " "; color: var(--muted); font-size: 12px; }
}
</style>
</head>
<body>
<main>
  <h1>코그페 할인 인증표</h1>
  <p class="sub">코리아 그랜드 페스티벌(2026.10.29 ~ 11.15) 주장 정가·할인가를 최근 2개월 실제 판매가와 비교 · <span id="updated"></span></p>
  <section class="kpis" id="kpis"></section>
  <details class="summary" id="summary" hidden></details>
  <details class="progress" id="progress">
    <summary>사이트별 진행 현황 <span id="progsum"></span></summary>
    <div class="tablewrap"><table class="ptable"><thead><tr><th>분야</th><th>판매처 / 소스</th><th>예상</th><th>수집</th><th>검증</th><th>상태</th></tr></thead><tbody id="prows"></tbody></table></div>
  </details>
  <div class="controls">
    <input id="q" type="search" placeholder="상품·업체·판매처 검색" aria-label="검색">
    <select id="cat" aria-label="분야"><option value="">전체 분야</option></select>
    <select id="verdict" aria-label="판정"><option value="">전체 판정</option></select>
    <select id="stage" aria-label="진행단계"><option value="">전체 단계</option></select>
    <select id="sort" aria-label="정렬">
      <option value="real_discount_pct:-1">실질 할인 높은순</option>
      <option value="shown_discount_pct:-1">표시 할인 높은순</option>
      <option value="inflation_pct:-1">정가 부풀림 큰순</option>
      <option value="sale_price:1">할인가 낮은순</option>
      <option value="sale_price:-1">할인가 높은순</option>
      <option value="rating:-1">별점 높은순</option>
      <option value="review_count:-1">리뷰 많은순</option>
      <option value="product:1">상품명순</option>
    </select>
    <span class="count" id="count"></span>
  </div>
  <div class="tablewrap">
    <table id="tbl">
      <thead><tr>
        <th data-sort="category_label">분야</th>
        <th data-sort="product">상품</th>
        <th data-sort="claimed_original_price">주장 정가</th>
        <th data-sort="sale_price">할인가</th>
        <th data-sort="shown_discount_pct">표시 할인</th>
        <th data-sort="price_60d_typical">2개월 대표가</th>
        <th data-sort="price_60d_low">2개월 최저가</th>
        <th data-sort="real_discount_pct" class="desc">실질 할인</th>
        <th data-sort="inflation_pct">정가 부풀림</th>
        <th data-sort="rating">별점</th>
        <th data-sort="verdict">판정</th>
        <th>구매</th>
        <th>검증 메모</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <button id="more" class="more" hidden></button>
</main>
<script src="data.js"></script>
<script src="data-0.js"></script>
<script>
const DATA = window.KGF_DATA || { items: [], summary: {} };
const items = DATA.items, summary = DATA.summary || {}, sources = DATA.sources || [];
const $ = id => document.getElementById(id);
const won = v => v == null ? "–" : v.toLocaleString("ko-KR") + "원";
const pct = (v, signed) => v == null ? "–" : (signed && v > 0 ? "+" : "") + v.toFixed(1) + "%";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BADGE = {"진짜 할인":"b-good","소폭 할인":"b-mid","평소가":"b-flat","할인 아님":"b-bad","판단불가":"b-flat","이력 없음":"b-flat"};
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : null;

function kpis() {
  const real = items.filter(i => i.real_discount_pct != null);
  const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
  const infl = items.filter(i => i.inflation_pct != null);
  const cards = [
    [items.length.toLocaleString("ko-KR") + "개", "조사 품목"],
    [items.filter(i => i.verdict === "진짜 할인").length + "개", "실질 20%+ 할인"],
    [pct(avg(items.map(i => i.shown_discount_pct).filter(v => v != null))), "평균 표시 할인율"],
    [pct(avg(real.map(i => i.real_discount_pct))), "평균 실질 할인율"],
    [infl.filter(i => i.inflation_pct >= 10).length + "개", "정가 10%+ 부풀림 의심"],
  ];
  $("kpis").innerHTML = cards.map(([b, s]) => `<div class="kpi"><b>${b}</b><span>${s}</span></div>`).join("");
}

function summaryBox() {
  if (!summary.headline && !(summary.findings || []).length) return;
  const el = $("summary");
  el.hidden = false;
  el.innerHTML = `<summary>${esc(summary.headline || "결론")}<span class="hint">펼쳐서 자세히 보기</span></summary>` +
    `<ul>${(summary.findings || []).map(f => `<li>${esc(f)}</li>`).join("")}</ul>` +
    ((summary.caveats || []).length ? `<ul class="caveat">${summary.caveats.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : "");
}

function fillSelect(id, key) {
  [...new Set(items.map(i => i[key]).filter(Boolean))].sort().forEach(v => {
    const o = document.createElement("option"); o.value = o.textContent = v; $(id).appendChild(o);
  });
}

// 실질 할인 데이터가 아직 없으면(수집 단계) 표시 할인율 순으로 보여준다
let sortKey, sortDir;
// 머리줄 클릭과 정렬 드롭다운(폰에서는 머리줄이 숨겨짐)이 같은 상태를 쓴다
function setSort(k, dir) {
  sortKey = k; sortDir = dir;
  document.querySelectorAll("th[data-sort]").forEach(t => {
    t.classList.remove("asc", "desc");
    if (t.dataset.sort === k) t.classList.add(dir > 0 ? "asc" : "desc");
  });
  const opt = [...$("sort").options].find(o => o.value === `${k}:${dir}`);
  $("sort").value = opt ? opt.value : "";
}
setSort(items.some(i => i.real_discount_pct != null) ? "real_discount_pct" : "shown_discount_pct", -1);

function row(i) {
  const url = safeUrl(i.buy_url);
  const cls = v => v == null ? "" : v < 0 ? "neg" : "pos";
  return `<tr data-id="${esc(i.item_id)}">
    <td data-label="분야">${esc(i.category_label)}</td>
    <td data-label=""><div class="pcell">${safeUrl(i.image_url) ? `<img class="thumb" src="${esc(i.image_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : `<div class="thumb"></div>`}<div><div class="prod">${esc(i.product)}</div><div class="meta">${i.unit ? esc(i.unit) + " · " : ""}${esc(i.vendor)} · ${esc(i.channel)}</div>${safeUrl(i.kgf_evidence) ? `<div class="meta"><a href="${esc(i.kgf_evidence)}" target="_blank" rel="noopener noreferrer">${esc(i.kgf_scope || "코그페")} 근거</a></div>` : ""}${i.conditions ? `<div class="cond" title="${esc(i.conditions)}">${esc(i.conditions)}</div>` : ""}${i.rating != null ? `<div class="rating">★ ${Number(i.rating).toFixed(1)}${i.review_count != null ? ` <span>(${Number(i.review_count).toLocaleString("ko-KR")})</span>` : ""}</div>` : ""}</div></div></td>
    <td class="num" data-label="주장 정가">${won(i.claimed_original_price)}</td>
    <td class="num" data-label="할인가"><b>${won(i.sale_price)}</b></td>
    <td class="num" data-label="표시 할인">${pct(i.shown_discount_pct)}</td>
    <td class="num" data-label="2개월 대표가">${won(i.price_60d_typical)}</td>
    <td class="num" data-label="2개월 최저가">${won(i.price_60d_low)}</td>
    <td class="num ${cls(i.real_discount_pct)}" data-label="실질 할인"><b>${pct(i.real_discount_pct)}</b></td>
    <td class="num ${i.inflation_pct >= 10 ? "neg" : ""}" data-label="정가 부풀림">${pct(i.inflation_pct, true)}</td>
    <td class="num" data-label="별점">${i.rating != null ? Number(i.rating).toFixed(1) : "–"}</td>
    <td data-label="판정"><span class="badge ${BADGE[i.verdict] || "b-flat"}">${esc(i.verdict)}</span>${i.stage && i.stage !== "검증" ? `<span class="stage">${esc(i.stage)}</span>` : ""}${i.basis_note ? `<div class="meta">${esc(i.basis_note)}</div>` : ""}</td>
    <td data-label="">${url ? `<a class="buy" href="${esc(url)}" target="_blank" rel="noopener noreferrer">구매하기</a>` : "–"}</td>
    <td class="note" data-label="검증">${esc(i.verify_status || "")}${i.verify_note ? " · " + esc(i.verify_note) : ""}</td>
  </tr>`;
}

function render() {
  const q = $("q").value.trim().toLowerCase(), cat = $("cat").value, vd = $("verdict").value, st = $("stage").value;
  const list = items.filter(i =>
    (!cat || i.category_label === cat) && (!vd || i.verdict === vd) && (!st || i.stage === st) &&
    (!q || [i.product, i.vendor, i.channel, i.model_code].join(" ").toLowerCase().includes(q)));
  list.sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y), "ko")) * sortDir;
  });
  $("rows").innerHTML = list.length ? list.slice(0, shown).map(row).join("") : `<tr><td colspan="13" class="empty">조건에 맞는 품목이 없습니다</td></tr>`;
  $("count").textContent = `${list.length} / ${items.length}개`;
  $("more").hidden = list.length <= shown;
  $("more").textContent = `더 보기 (${Math.min(shown, list.length)} / ${list.length})`;
}

const PAGE = 300;
let shown = PAGE;
$("more").addEventListener("click", () => { shown += PAGE; render(); });

document.querySelectorAll("th[data-sort]").forEach(th => th.addEventListener("click", () => {
  const k = th.dataset.sort;
  setSort(k, sortKey === k ? -sortDir : (["product", "category_label", "verdict"].includes(k) ? 1 : -1));
  shown = PAGE; render();
}));
$("sort").addEventListener("change", () => {
  const [k, d] = $("sort").value.split(":");
  setSort(k, Number(d));
  shown = PAGE; render();
});
let timer;
["q", "cat", "verdict", "stage"].forEach(id => $(id).addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(() => { shown = PAGE; render(); }, 200);
}));

function progressBox() {
  if (!sources.length) { $("progress").hidden = true; return; }
  const cnt = {};
  sources.forEach(s => cnt[s.status] = (cnt[s.status] || 0) + 1);
  $("progsum").textContent = `· 소스 ${sources.length}개 · ` + Object.entries(cnt).map(([k, v]) => `${k} ${v}`).join(" · ");
  const order = {"검증완료": 0, "가격조사중": 1, "수집완료": 2, "대기": 3, "제외(로그인)": 4};
  $("prows").innerHTML = [...sources].sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9)).map(s => {
    const url = safeUrl(s.url);
    return `<tr><td>${esc(s.category)}</td><td>${url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(s.channel)}</a>` : esc(s.channel)}<div class="meta">${esc(s.source_id)}</div></td>
      <td class="num">${s.est_items ?? "–"}</td><td class="num">${s.items}</td><td class="num">${s.verified}</td><td>${esc(s.status)}</td></tr>`;
  }).join("");
}

$("updated").textContent = summary.updated_at ? `갱신 ${summary.updated_at}` : "";
kpis(); summaryBox(); progressBox(); fillSelect("cat", "category_label"); fillSelect("verdict", "verdict"); fillSelect("stage", "stage"); render();
</script>
</body>
</html>
